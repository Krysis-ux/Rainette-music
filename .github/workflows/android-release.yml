name: Publish Rainette release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Validate tagged release version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must use the exact vMAJOR.MINOR.PATCH format.'
          }
          $releaseVersion = $Matches[1]
          $appVersion = (python -c "import version; print(version.APP_VERSION)").Trim()
          if ($appVersion -ne $releaseVersion) {
            throw "Tag version $releaseVersion does not match version.APP_VERSION $appVersion."
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Check JavaScript module syntax
        shell: pwsh
        run: |
          Get-ChildItem web -File | Where-Object { $_.Extension -in '.js', '.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed for $($_.Name)." }
          }

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Verify Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
          test -n "${ANDROID_SIGNING_CERT_SHA256}" || { echo "ANDROID_SIGNING_CERT_SHA256 is not configured" >&2; exit 1; }

      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/rainette-release.jks"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rainette-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RAINETTE_VERSION_NAME: ${{ needs.test.outputs.release_version }}
          RAINETTE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Add Android signing tools to PATH
        shell: bash
        run: |
          APKSIGNER_PATH="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${APKSIGNER_PATH}" || { echo "apksigner was not found" >&2; exit 1; }
          echo "$(dirname "${APKSIGNER_PATH}")" >> "${GITHUB_PATH}"

      - name: Verify production Android signature and prepare assets
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          CERT_OUTPUT="$(apksigner verify --verbose --print-certs "${APK}")"
          printf '%s\n' "${CERT_OUTPUT}"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "${CERT_OUTPUT}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "${ANDROID_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_CERT_SHA256}" || { echo "APK signer does not match the configured production certificate" >&2; exit 1; }

          ASSET_DIR="${RUNNER_TEMP}/rainette-android-release"
          mkdir -p "${ASSET_DIR}"
          cp "${APK}" "${ASSET_DIR}/rainette-music-android.apk"
          (cd "${ASSET_DIR}" && sha256sum rainette-music-android.apk > rainette-music-android.apk.sha256)
          export ASSET_DIR
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const digest = fs.readFileSync(path.join(process.env.ASSET_DIR, 'rainette-music-android.apk.sha256'), 'utf8').trim().split(/\s+/)[0];
          fs.writeFileSync(path.join(process.env.ASSET_DIR, 'android-release.json'), JSON.stringify({
            artifact: 'rainette-music-android.apk',
            version: process.env.RELEASE_VERSION,
            versionCode: Number(process.env.GITHUB_RUN_NUMBER),
            channel: 'stable',
            signed: true,
            signatureVerified: true,
            sha256: digest,
          }, null, 2) + '\n');
          NODE

      - name: Upload verified Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-android-release
          path: |
            ${{ runner.temp }}/rainette-android-release/rainette-music-android.apk
            ${{ runner.temp }}/rainette-android-release/rainette-music-android.apk.sha256
            ${{ runner.temp }}/rainette-android-release/android-release.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove Android signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/rainette-release.jks"

  windows-build:
    needs: test
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Windows build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build unsigned Windows application with pinned update signer
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          .\release\build-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Phase BuildUnsigned `
            -ExpectedSignerCertSha256 $env:WINDOWS_CODESIGN_CERT_SHA256

      - name: Upload unsigned Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-unsigned
          path: |
            release/stage/RainetteMusic
            release/stage/rainette-unsigned-build.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    needs: [test, windows-build]
    runs-on: windows-latest
    environment: windows-signing
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download unsigned Windows application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-windows-unsigned
          path: release/stage

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Locate Windows signing tools
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'The Windows SDK signtool.exe was not found.' }
          $signTool.DirectoryName >> $env:GITHUB_PATH

      - name: Sign application and package Windows release in isolated phase
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          foreach ($name in 'WINDOWS_CODESIGN_CERT_BASE64', 'WINDOWS_CODESIGN_CERT_PASSWORD', 'WINDOWS_CODESIGN_CERT_SHA256') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "$name is not configured." }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'rainette-codesign.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          if ((Get-Item -LiteralPath $certificatePath).Length -eq 0) { throw 'Decoded code-signing certificate is empty.' }
          $env:RAINETTE_CODESIGN_CERT_PATH = $certificatePath
          $env:RAINETTE_CODESIGN_CERT_PASSWORD = $env:WINDOWS_CODESIGN_CERT_PASSWORD
          try {
            .\release\build-windows-release.ps1 `
              -Version $env:RELEASE_VERSION `
              -Phase SignAndPackage `
              -ExpectedSignerCertSha256 $env:WINDOWS_CODESIGN_CERT_SHA256
          } finally {
            Remove-Item Env:RAINETTE_CODESIGN_CERT_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:RAINETTE_CODESIGN_CERT_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signed Windows release assets
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_SHA256: ${{ vars.WINDOWS_CODESIGN_CERT_SHA256 }}
        run: |
          $app = 'release\stage\RainetteMusic\RainetteMusic.exe'
          $installer = 'release\out\RainetteMusicSetup.exe'
          $sidecar = 'release\out\RainetteMusicSetup.exe.sha256'
          $manifestPath = 'release\out\windows-release.json'
          foreach ($path in $app, $installer, $sidecar, $manifestPath) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected release output is missing: $path" }
          }

          $expectedCertificate = $env:WINDOWS_CODESIGN_CERT_SHA256.Replace(':', '').Replace(' ', '').ToLowerInvariant()
          foreach ($path in $app, $installer) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "Authenticode verification failed for $path."
            }
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $certificateHash = [BitConverter]::ToString($hasher.ComputeHash($signature.SignerCertificate.RawData)).Replace('-', '').ToLowerInvariant()
            } finally {
              $hasher.Dispose()
            }
            if ($certificateHash -ne $expectedCertificate) { throw "Unexpected Authenticode signer for $path." }
          }

          $checksum = (Get-Content -LiteralPath $sidecar -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-fA-F]{64})  RainetteMusicSetup\.exe$') { throw 'Windows checksum sidecar is malformed.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Windows installer checksum does not match its sidecar.' }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.artifact -ne 'RainetteMusicSetup.exe' -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Windows release manifest identity does not match the tagged build.'
          }
          if ($manifest.signed -ne $true -or $manifest.signatureVerified -ne $true -or $manifest.channel -ne 'release') {
            throw 'Windows release manifest does not describe a verified production-signed build.'
          }
          if ($manifest.sha256 -ne $actualHash) { throw 'Windows release manifest checksum does not match the installer.' }

      - name: Upload verified Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-release
          path: |
            release/out/RainetteMusicSetup.exe
            release/out/RainetteMusicSetup.exe.sha256
            release/out/windows-release.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove Windows code-signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'rainette-codesign.pfx') -Force -ErrorAction SilentlyContinue

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Download produced release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rainette-*-release
          path: release-assets
          merge-multiple: true

      - name: Verify exact release asset set
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          expected=(
            RainetteMusicSetup.exe
            RainetteMusicSetup.exe.sha256
            android-release.json
            rainette-music-android.apk
            rainette-music-android.apk.sha256
            windows-release.json
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")
          (cd release-assets && sha256sum --check rainette-music-android.apk.sha256 RainetteMusicSetup.exe.sha256)

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = {
            'android-release.json': 'rainette-music-android.apk',
            'windows-release.json': 'RainetteMusicSetup.exe',
          };
          for (const [manifestName, artifact] of Object.entries(expected)) {
            const manifest = JSON.parse(fs.readFileSync(path.join('release-assets', manifestName), 'utf8'));
            if (manifest.artifact !== artifact || manifest.version !== process.env.RELEASE_VERSION) {
              throw new Error(`${manifestName} does not match this tagged release`);
            }
            if (manifest.signed !== true || manifest.signatureVerified !== true) {
              throw new Error(`${manifestName} is not production-signature verified`);
            }
          }
          NODE

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/rainette-music-android.apk
            release-assets/rainette-music-android.apk.sha256
            release-assets/android-release.json
            release-assets/RainetteMusicSetup.exe
            release-assets/RainetteMusicSetup.exe.sha256
            release-assets/windows-release.json
