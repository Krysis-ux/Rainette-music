name: Publish Rainette release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
      android_enabled: ${{ steps.android_gate.outputs.enabled }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest playwright

      - name: Install Playwright browser for UI smoke tests
        shell: pwsh
        run: python -m playwright install chromium

      - name: Validate tagged release version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must use the exact vMAJOR.MINOR.PATCH format.'
          }
          $releaseVersion = $Matches[1]
          $appVersion = (python -c "import version; print(version.APP_VERSION)").Trim()
          if ($appVersion -ne $releaseVersion) {
            throw "Tag version $releaseVersion does not match version.APP_VERSION $appVersion."
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      # Android publishing is optional: without its signing secrets the release
      # ships Windows-only, and the app's Mobile page shows its release-not-
      # available state. Job-level `if` cannot read the secrets context, so this
      # step exports the decision as a job output instead.
      - name: Decide whether Android release signing is configured
        id: android_gate
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check JavaScript module syntax
        shell: pwsh
        run: |
          Get-ChildItem web -File | Where-Object { $_.Extension -in '.js', '.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed for $($_.Name)." }
          }

  android:
    needs: test
    if: needs.test.outputs.android_enabled == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Verify Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
          test -n "${ANDROID_SIGNING_CERT_SHA256}" || { echo "ANDROID_SIGNING_CERT_SHA256 is not configured" >&2; exit 1; }

      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/rainette-release.jks"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rainette-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RAINETTE_VERSION_NAME: ${{ needs.test.outputs.release_version }}
          RAINETTE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Add Android signing tools to PATH
        shell: bash
        run: |
          APKSIGNER_PATH="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${APKSIGNER_PATH}" || { echo "apksigner was not found" >&2; exit 1; }
          echo "$(dirname "${APKSIGNER_PATH}")" >> "${GITHUB_PATH}"

      - name: Verify production Android signature and prepare assets
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          CERT_OUTPUT="$(apksigner verify --verbose --print-certs "${APK}")"
          printf '%s\n' "${CERT_OUTPUT}"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "${CERT_OUTPUT}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "${ANDROID_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_CERT_SHA256}" || { echo "APK signer does not match the configured production certificate" >&2; exit 1; }

          ASSET_DIR="${RUNNER_TEMP}/rainette-android-release"
          mkdir -p "${ASSET_DIR}"
          cp "${APK}" "${ASSET_DIR}/rainette-music-android.apk"
          (cd "${ASSET_DIR}" && sha256sum rainette-music-android.apk > rainette-music-android.apk.sha256)
          export ASSET_DIR
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const digest = fs.readFileSync(path.join(process.env.ASSET_DIR, 'rainette-music-android.apk.sha256'), 'utf8').trim().split(/\s+/)[0];
          fs.writeFileSync(path.join(process.env.ASSET_DIR, 'android-release.json'), JSON.stringify({
            artifact: 'rainette-music-android.apk',
            version: process.env.RELEASE_VERSION,
            versionCode: Number(process.env.GITHUB_RUN_NUMBER),
            channel: 'stable',
            signed: true,
            signatureVerified: true,
            sha256: digest,
          }, null, 2) + '\n');
          NODE

      - name: Upload verified Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-android-release
          path: |
            ${{ runner.temp }}/rainette-android-release/rainette-music-android.apk
            ${{ runner.temp }}/rainette-android-release/rainette-music-android.apk.sha256
            ${{ runner.temp }}/rainette-android-release/android-release.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove Android signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/rainette-release.jks"

  # Builds and packages the Windows release without any credentials. The update
  # root of trust is the Ed25519 manifest signature added by windows-sign below;
  # Authenticode (the SignAndPackage phase + a windows-signing environment) can
  # be reinstated as an additional layer if Rainette ever acquires a
  # code-signing certificate.
  windows-build:
    needs: test
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Windows build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build and package the Windows release
        shell: pwsh
        run: |
          .\release\build-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Phase Release

      - name: Verify built Windows release assets
        shell: pwsh
        run: |
          $installer = 'release\out\RainetteMusicSetup.exe'
          $sidecar = 'release\out\RainetteMusicSetup.exe.sha256'
          $manifestPath = 'release\out\windows-release.json'
          foreach ($path in $installer, $sidecar, $manifestPath) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected release output is missing: $path" }
          }

          $checksum = (Get-Content -LiteralPath $sidecar -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-fA-F]{64})  RainetteMusicSetup\.exe$') { throw 'Windows checksum sidecar is malformed.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Windows installer checksum does not match its sidecar.' }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 2 -or $manifest.channel -ne 'release') {
            throw 'Windows release manifest does not describe an installable release build.'
          }
          if ($manifest.artifact -ne 'RainetteMusicSetup.exe' -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Windows release manifest identity does not match the tagged build.'
          }
          if ($manifest.sha256 -ne $actualHash) { throw 'Windows release manifest checksum does not match the installer.' }

          $exeInfo = (Get-Item -LiteralPath 'release\stage\RainetteMusic\RainetteMusic.exe').VersionInfo
          if ($exeInfo.FileDescription -ne 'Rainette Music') {
            throw 'RainetteMusic.exe is missing its branded version resource (Task Manager would show a bare filename).'
          }

      - name: Upload built Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-release
          path: |
            release/out/RainetteMusicSetup.exe
            release/out/RainetteMusicSetup.exe.sha256
            release/out/windows-release.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The only job holding the update-signing secret. It runs exactly one small,
  # reviewed script (release/sign_manifest.py) and never executes the packaged
  # application, PyInstaller, or the rest of the project's dependency tree —
  # the same credential-isolation principle the old Authenticode phase used.
  windows-sign:
    needs: [test, windows-build]
    runs-on: ubuntu-latest
    environment: release-signing

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42.0'

      - name: Download built Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-windows-release
          path: release/out

      - name: Sign the release manifest
        env:
          RAINETTE_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "${RAINETTE_UPDATE_SIGNING_KEY}" || { echo "UPDATE_SIGNING_KEY secret is not configured (generate one with release/new_signing_key.py)" >&2; exit 1; }
          python release/sign_manifest.py release/out/windows-release.json

      - name: Verify the signature against the committed public key
        run: |
          python - <<'PY'
          import base64
          import sys
          sys.path.insert(0, ".")
          import release_identity
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          manifest = open("release/out/windows-release.json", "rb").read()
          signature = base64.b64decode(open("release/out/windows-release.json.sig", "rb").read())
          keys = [value.strip() for value in release_identity.UPDATE_SIGNER_PUBLIC_KEY.split(",") if value.strip()]
          if not keys:
              raise SystemExit("UPDATE_SIGNER_PUBLIC_KEY in release_identity.py is empty - commit the public key before releasing")
          for key in keys:
              try:
                  Ed25519PublicKey.from_public_bytes(base64.b64decode(key)).verify(signature, manifest)
                  print("manifest signature verifies against the committed public key")
                  break
              except Exception:
                  continue
          else:
              raise SystemExit("UPDATE_SIGNING_KEY does not match UPDATE_SIGNER_PUBLIC_KEY - installed apps would refuse this release")
          PY

      - name: Upload manifest signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-manifest-signature
          path: release/out/windows-release.json.sig
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [android, windows-sign]
    # Publish whenever the signed Windows release is ready; Android is optional
    # (skipped when its signing secrets are absent) but must never have failed.
    if: ${{ !cancelled() && needs.windows-sign.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      ANDROID_RESULT: ${{ needs.android.result }}

    steps:
      - name: Download produced release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rainette-*-release
          path: release-assets
          merge-multiple: true

      - name: Download manifest signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-windows-manifest-signature
          path: release-assets

      - name: Verify exact release asset set
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          expected=(
            RainetteMusicSetup.exe
            RainetteMusicSetup.exe.sha256
            windows-release.json
            windows-release.json.sig
          )
          checks=(RainetteMusicSetup.exe.sha256)
          if [ "${ANDROID_RESULT}" = "success" ]; then
            expected+=(
              android-release.json
              rainette-music-android.apk
              rainette-music-android.apk.sha256
            )
            checks+=(rainette-music-android.apk.sha256)
          fi
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")
          (cd release-assets && sha256sum --check "${checks[@]}")

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (name) => JSON.parse(fs.readFileSync(path.join('release-assets', name), 'utf8'));

          if (fs.existsSync(path.join('release-assets', 'android-release.json'))) {
            const android = read('android-release.json');
            if (android.artifact !== 'rainette-music-android.apk' || android.version !== process.env.RELEASE_VERSION) {
              throw new Error('android-release.json does not match this tagged release');
            }
            if (android.signed !== true || android.signatureVerified !== true) {
              throw new Error('android-release.json is not production-signature verified');
            }
          }

          // The Windows manifest is schema 2: its authenticity comes from the
          // Ed25519 signature (verified in windows-sign against the committed
          // public key), and the channel gate keeps dev builds non-installable.
          const windows = read('windows-release.json');
          if (windows.artifact !== 'RainetteMusicSetup.exe' || windows.version !== process.env.RELEASE_VERSION) {
            throw new Error('windows-release.json does not match this tagged release');
          }
          if (windows.schema !== 2 || windows.channel !== 'release') {
            throw new Error('windows-release.json does not describe an installable release build');
          }
          NODE

      # The exact-set check above is the gate; the glob then uploads precisely
      # that verified set whether or not the optional Android assets exist.
      # Filenames it can publish: RainetteMusicSetup.exe, RainetteMusicSetup.exe.sha256,
      # windows-release.json, windows-release.json.sig, rainette-music-android.apk,
      # rainette-music-android.apk.sha256, android-release.json.
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release-assets/*
