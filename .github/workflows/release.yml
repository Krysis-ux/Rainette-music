name: Publish Rainette release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest playwright

      - name: Install Playwright browser for UI smoke tests
        shell: pwsh
        run: python -m playwright install chromium

      - name: Validate tagged release version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must use the exact vMAJOR.MINOR.PATCH format.'
          }
          $releaseVersion = $Matches[1]
          $appVersion = (python -c "import version; print(version.APP_VERSION)").Trim()
          if ($appVersion -ne $releaseVersion) {
            throw "Tag version $releaseVersion does not match version.APP_VERSION $appVersion."
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q


      - name: Check JavaScript module syntax
        shell: pwsh
        run: |
          Get-ChildItem web -File | Where-Object { $_.Extension -in '.js', '.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed for $($_.Name)." }
          }

  windows-build:
    needs: test
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Windows build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build and package the Windows release
        shell: pwsh
        run: |
          .\release\build-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Phase Release

      - name: Verify built Windows release assets
        shell: pwsh
        run: |
          $installer = 'release\out\RainetteMusicSetup.exe'
          $manifestPath = 'release\out\latest.json'
          foreach ($path in $installer, $manifestPath) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected release output is missing: $path" }
          }

          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 2 -or $manifest.channel -ne 'release') {
            throw 'Windows release manifest does not describe an installable release build.'
          }
          if ($manifest.artifact -ne 'RainetteMusicSetup.exe' -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Windows release manifest identity does not match the tagged build.'
          }
          if ($manifest.sha256 -ne $actualHash) { throw 'Windows release manifest checksum does not match the installer.' }

          $exeInfo = (Get-Item -LiteralPath 'release\stage\RainetteMusic\RainetteMusic.exe').VersionInfo
          if ($exeInfo.FileDescription -ne 'Rainette Music') {
            throw 'RainetteMusic.exe is missing its branded version resource (Task Manager would show a bare filename).'
          }

      - name: Upload built Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-release
          path: |
            release/out/RainetteMusicSetup.exe
            release/out/latest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # macOS ships as a drag-to-install disk image, not an installer, and carries
  # no update manifest: Rainette's updater installs the signed Windows installer
  # and refuses to run anywhere else (main.UNSUPPORTED_PLATFORM_UPDATE_MSG), so
  # there is nothing here for it to verify and nothing for windows-sign to sign.
  #
  # The build is ad-hoc signed rather than notarized, which Gatekeeper treats as
  # untrusted for anything downloaded from the internet. That is a real cost
  # borne by every user, so the release notes say so and give the one command
  # that clears it. Notarizing needs an Apple Developer identity plus
  # APPLE_ID/TEAM_ID/app-specific-password secrets; when those exist, add the
  # --sign/notarytool steps to release/build-macos-release.sh rather than here.
  macos-build:
    needs: test
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ needs.test.outputs.release_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install macOS build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build the macOS app bundle and disk image
        run: ./release/build-macos-release.sh --version "${RELEASE_VERSION}" --dmg

      - name: Verify the built bundle and disk image
        run: |
          set -euo pipefail
          APP="release/out-macos/Rainette Music.app"
          [ -d "$APP" ] || { echo "PyInstaller produced no .app bundle" >&2; exit 1; }

          # The bundle is what users get, so the checks are on the bundle rather
          # than on the tree it was built from.
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$version" = "$RELEASE_VERSION" ] || { echo "bundle version $version != $RELEASE_VERSION" >&2; exit 1; }

          # The web UI is loaded from disk at runtime; a bundle missing it opens
          # to a blank window rather than failing loudly.
          for asset in index.html rainette_music.js audio_outputs.js miniplayer.html; do
            [ -f "$APP/Contents/Resources/web/$asset" ] || { echo "bundled web/$asset is missing" >&2; exit 1; }
          done

          codesign --verify --deep --strict "$APP"

          # Mount the image and check what a user would actually see: the app,
          # and the Applications symlink they drag it onto. A disk image that
          # builds but mounts empty is a failure nothing else here would catch.
          DMG="release/out-macos/RainetteMusic-macOS.dmg"
          [ -f "$DMG" ] || { echo "no disk image was produced" >&2; exit 1; }
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT" >/dev/null
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          [ -d "$MOUNT/Rainette Music.app" ] || { echo "the disk image contains no app" >&2; exit 1; }
          [ -L "$MOUNT/Applications" ] || { echo "the disk image has no drag-to-install target" >&2; exit 1; }
          # The signature has to survive the trip through the image, or the copy
          # a user drags out is the broken one.
          codesign --verify --deep --strict "$MOUNT/Rainette Music.app"

      - name: Verify the self-update archive and its manifest
        run: |
          set -euo pipefail
          ARCHIVE="release/out-macos/RainetteMusic-macOS.zip"
          MANIFEST="release/out-macos/latest-macos.json"
          for path in "$ARCHIVE" "$MANIFEST"; do
            [ -f "$path" ] || { echo "expected release output is missing: $path" >&2; exit 1; }
          done

          # The updater checks the streamed bytes against the hash the signed
          # manifest pins, so a manifest that disagrees with its own archive
          # would ship an update no installed app could ever accept.
          ACTUAL=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          python3 - "$MANIFEST" "$ACTUAL" "$RELEASE_VERSION" <<'PY'
          import json, sys
          manifest_path, actual_hash, release_version = sys.argv[1:4]
          manifest = json.load(open(manifest_path))
          if manifest.get("schema") != 2 or manifest.get("channel") != "release":
              raise SystemExit("macOS manifest does not describe an installable release build")
          if manifest.get("artifact") != "RainetteMusic-macOS.zip":
              raise SystemExit("macOS manifest names the wrong artifact")
          if manifest.get("version") != release_version:
              raise SystemExit("macOS manifest version does not match the tagged build")
          if manifest.get("sha256") != actual_hash:
              raise SystemExit("macOS manifest checksum does not match the archive")
          print("macOS update manifest matches its archive")
          PY

          # A bundle whose signature does not survive the round trip is one the
          # updater will refuse after downloading it, which is the worst place
          # to find out.
          UNPACKED=$(mktemp -d)
          ditto -xk "$ARCHIVE" "$UNPACKED"
          codesign --verify --deep --strict "$UNPACKED/Rainette Music.app"

      - name: Upload built macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-macos-release
          path: |
            release/out-macos/RainetteMusic-macOS.dmg
            release/out-macos/RainetteMusic-macOS.zip
            release/out-macos/latest-macos.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The only job holding the update-signing secret. It runs exactly one small,
  # reviewed script (release/sign_manifest.py) and never executes the packaged
  # application, PyInstaller, or the rest of the project's dependency tree —
  # the same credential-isolation principle the old Authenticode phase used.
  windows-sign:
    needs: [test, windows-build, macos-build]
    runs-on: ubuntu-latest
    environment: release-signing

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42.0'

      - name: Download built Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-windows-release
          path: release/out

      - name: Download built macOS release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-macos-release
          path: release/out-macos

      - name: Sign the release manifests
        env:
          RAINETTE_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "${RAINETTE_UPDATE_SIGNING_KEY}" || { echo "UPDATE_SIGNING_KEY secret is not configured (generate one with release/new_signing_key.py)" >&2; exit 1; }
          python release/sign_manifest.py release/out/latest.json
          # Same key, same script, same isolation: macOS updates are trusted by
          # this Ed25519 signature alone, which is why they need nothing from
          # Apple. Notarisation only removes Gatekeeper's prompt on a manual
          # download and has no bearing on whether an update verifies.
          python release/sign_manifest.py release/out-macos/latest-macos.json

      - name: Verify both signatures against the committed public key
        run: |
          python - <<'PY'
          import base64
          import sys
          sys.path.insert(0, ".")
          import version
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          keys = [value.strip() for value in version.UPDATE_SIGNER_PUBLIC_KEY.split(",") if value.strip()]
          if not keys:
              raise SystemExit("UPDATE_SIGNER_PUBLIC_KEY in version.py is empty - commit the public key before releasing")

          for label, path in (
              ("Windows", "release/out/latest.json"),
              ("macOS", "release/out-macos/latest-macos.json"),
          ):
              manifest = open(path, "rb").read()
              signature = base64.b64decode(open(f"{path}.sig", "rb").read())
              for key in keys:
                  try:
                      Ed25519PublicKey.from_public_bytes(base64.b64decode(key)).verify(signature, manifest)
                      print(f"{label} manifest signature verifies against the committed public key")
                      break
                  except Exception:
                      continue
              else:
                  raise SystemExit(
                      f"UPDATE_SIGNING_KEY does not match UPDATE_SIGNER_PUBLIC_KEY for the {label} manifest "
                      "- installed apps would refuse this release"
                  )
          PY

      # Collected into one directory first: upload-artifact roots a multi-path
      # upload at the paths' common ancestor, so listing them from release/out
      # and release/out-macos would publish them nested under those names rather
      # than as the flat assets publish expects.
      - name: Collect the signatures
        run: |
          set -euo pipefail
          mkdir -p release/signatures
          cp release/out/latest.json.sig release/signatures/
          cp release/out-macos/latest-macos.json.sig release/signatures/

      - name: Upload manifest signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rainette-windows-manifest-signature
          path: release/signatures/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [windows-sign, macos-build]
    # Desktop binaries only. Phones run the PWA (music-pwa-web), which deploys
    # from its own repository on its own cadence and is intentionally not an
    # asset of this release.
    if: ${{ !cancelled() && needs.windows-sign.result == 'success' && needs.macos-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Download produced release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rainette-*-release
          path: release-assets
          merge-multiple: true

      - name: Download manifest signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rainette-windows-manifest-signature
          path: release-assets

      - name: Verify exact release asset set
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          expected=(
            RainetteMusicSetup.exe
            RainetteMusic-macOS.dmg
            RainetteMusic-macOS.zip
            latest.json
            latest.json.sig
            latest-macos.json
            latest-macos.json.sig
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (name) => JSON.parse(fs.readFileSync(path.join('release-assets', name), 'utf8'));

          // The Windows manifest is schema 2: its authenticity comes from the
          // Ed25519 signature (verified in windows-sign against the committed
          // public key), and the channel gate keeps dev builds non-installable.
          const windows = read('latest.json');
          if (windows.artifact !== 'RainetteMusicSetup.exe' || windows.version !== process.env.RELEASE_VERSION) {
            throw new Error('latest.json does not match this tagged release');
          }
          if (windows.schema !== 2 || windows.channel !== 'release') {
            throw new Error('latest.json does not describe an installable release build');
          }

          // The macOS manifest is the same shape and carries the same weight:
          // a mismatch here means installed Macs either refuse the update or
          // are offered one for a version they already have.
          const macos = read('latest-macos.json');
          if (macos.artifact !== 'RainetteMusic-macOS.zip' || macos.version !== process.env.RELEASE_VERSION) {
            throw new Error('latest-macos.json does not match this tagged release');
          }
          if (macos.schema !== 2 || macos.channel !== 'release') {
            throw new Error('latest-macos.json does not describe an installable release build');
          }
          NODE

      # The exact-set check above is the gate; the glob then uploads precisely
      # that verified set. Filenames it can publish: RainetteMusicSetup.exe,
      # RainetteMusic-macOS.dmg, RainetteMusic-macOS.zip, latest.json,
      # latest.json.sig, latest-macos.json, latest-macos.json.sig.
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Windows** — get `RainetteMusicSetup.exe` and run it.

            **macOS** — get `RainetteMusic-macOS.dmg` and drag Rainette Music into Applications.
            It's not yet notarized, so macOS will call it damaged on first launch. It isn't.
            Run this once:

            ```
            xattr -dr com.apple.quarantine "/Applications/Rainette Music.app"
            ```

            After that first install, Rainette updates itself on macOS too. Open it
            from **Applications** rather than straight from the disk image, or macOS
            runs it from a read-only copy that cannot be replaced.

            **Phone** — open the [PWA](https://music-pwa-web.vercel.app) and pair it. Nothing to install.

            The `latest*.json` files and the `.zip` are for the updater. You don't need them.
          files: release-assets/*
