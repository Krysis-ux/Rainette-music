name: PWA companion checks

on:
  pull_request:
    paths:
      - "pwa/**"
      - "companion.py"
      - "server.py"
      - "tests/test_companion.py"
      - "tests/test_companion_security.py"
      - "tests/test_pwa_session_e2e.py"
      - ".github/workflows/pwa-companion-checks.yml"
  push:
    branches:
      - main
    paths:
      - "pwa/**"
      - "companion.py"
      - "server.py"
      - "tests/test_companion.py"
      - "tests/test_companion_security.py"
      - "tests/test_pwa_session_e2e.py"
      - ".github/workflows/pwa-companion-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile companion gateway
        run: python -m py_compile server.py companion.py

      - name: Run pairing and session-isolation tests
        run: >-
          python -m pytest -q
          tests/test_companion.py
          tests/test_companion_security.py
          tests/test_pwa_session_e2e.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse browser JavaScript
        run: node --check pwa/app.js

      - name: Validate static configuration
        run: |
          python -m json.tool pwa/manifest.webmanifest > /dev/null
          python -m json.tool pwa/vercel.json > /dev/null

      # pwa/ is mirrored to Krysis-ux/music-pwa-web, which is what deploys.
      # A phone loading a client that its paired computer cannot answer is the
      # failure this guards against, so drift between the two must not merge.
      - name: Verify the deployable app shell is complete
        run: |
          for f in index.html styles.css app.js sw.js manifest.webmanifest \
                   vercel.json icon.svg icon-192.png icon-512.png \
                   icon-maskable-512.png apple-touch-icon.png; do
            test -f "pwa/$f" || { echo "missing pwa/$f"; exit 1; }
          done
          grep -q 'manifest.webmanifest' pwa/index.html
          grep -q 'serviceWorker.register' pwa/app.js
