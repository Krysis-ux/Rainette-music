<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Rainette Music</title>
	<link rel="icon" href="./assets/rainette-icon.ico">
	<script>
		// Applied synchronously, before any stylesheet loads, so the correct
		// theme/accent is already active on first paint (no flash of the
		// wrong theme). Mirrored in miniplayer.html for the detached window.
		(function () {
			try {
				var root = document.documentElement;
				var THEMES = { light: 'rw-theme-light', dark: 'rw-theme-dark', mono: 'rw-theme-mono', midnight: 'rw-theme-midnight' };
				// "auto", or no choice yet, follows the system's light/dark setting
				// live, the way the native Mac app does.
				var system = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
				var followSystem = function () { return system && system.matches ? THEMES.dark : THEMES.light; };
				root.classList.add(THEMES[localStorage.getItem('rainette.theme')] || followSystem());
				if (system && system.addEventListener) system.addEventListener('change', function () {
					try { if (THEMES[localStorage.getItem('rainette.theme')]) return; } catch (e) { return; }
					root.classList.remove(THEMES.light, THEMES.dark);
					root.classList.add(followSystem());
				});
				var accent = localStorage.getItem('rainette.accent');
				if (accent === 'green' || accent === 'teal' || accent === 'purple') root.classList.add('rw-accent-' + accent);
				if (localStorage.getItem('rainette.reducedMotion') === '1') root.classList.add('rw-reduced-motion');
			} catch (e) { /* localStorage unavailable */ }
		})();
	</script>
	<link rel="stylesheet" href="./rainette_tokens.css">
	<link rel="stylesheet" href="./rainette_pages.css">
	<link rel="stylesheet" href="./app.css">
	<link rel="stylesheet" href="./rainette_premium.css">
	<script>
		// In the pywebview app the transport lives in a separate native window,
		// so this (browser) window runs in "remote" mode: it sends play commands
		// over the socket instead of hosting its own <audio>. A plain browser tab
		// has no ?remote flag and keeps the docked in-page mini-player.
		window.RW_REMOTE = new URLSearchParams(location.search).has('remote');
		// This preference controls only automatic pop-out. Playback always stays
		// on the same native desktop engine, so disabling it never changes audio
		// routing or leaves the docked bar without controls.
		window.RW_MINIPLAYER_ENABLED = (function () {
			try { return localStorage.getItem('rainette.miniplayerEnabled') === '1'; }
			catch (e) { return false; }
		})();
	</script>
</head>
<body>
	<!-- The music page mounts here (RainetteRouter.register('music', …) → mount). -->
	<div id="rwMusicPage" class="rainette-page active"></div>

	<!-- The persistent draggable mini-player mounts here (browser/fallback only). -->
	<div id="rwMusicPlayer"></div>

	<!-- Re-revealing the detached player window is handled by the docked bar's
	     own pop-out button (rainette_music.js), so no separate float button. -->

	<script type="module" src="./rainette_music_player.js"></script>
	<script type="module" src="./rainette_music.js"></script>
</body>
</html>
